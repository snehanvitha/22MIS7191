<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications Dashboard</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      padding:30px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#222;
    }

    .notification-list{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:18px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      transition:0.3s;
      border-left:8px solid #999;
    }

    .card:hover{
      transform:translateY(-3px);
    }

    .placement{
      border-left-color:#2563eb;
    }

    .result{
      border-left-color:#16a34a;
    }

    .event{
      border-left-color:#f59e0b;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }

    .type{
      font-weight:bold;
      font-size:15px;
      color:#333;
      padding:6px 12px;
      border-radius:20px;
      background:#eef2ff;
    }

    .message{
      font-size:18px;
      margin-bottom:10px;
      color:#111827;
    }

    .timestamp{
      color:#6b7280;
      font-size:14px;
    }

    .loading,
    .error{
      text-align:center;
      font-size:18px;
      margin-top:30px;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Notifications</h1>

    <div id="loading" class="loading">
      Loading notifications...
    </div>

    <div id="error" class="error"></div>

    <div id="notificationList" class="notification-list"></div>
  </div>

 <script>

  const AUTH_URL =
    "http://4.224.186.213/evaluation-service/auth";

  const NOTIFICATION_URL =
    "http://4.224.186.213/evaluation-service/notifications";

  // Sort priority
  const priority = {
    Placement: 1,
    Result: 2,
    Event: 3
  };

  // Auth request body
  const authPayload = {

    email: "snehanvitha.22mis7191@vitapstudent.ac.in",

    name: "k snehanvitha",

    rollno: "22MIS7191",

    accessCode: "SfFuWg",

    clientID:
      "67be71d1-1695-4919-b416-89bf097384e7",

    clientSecret:
      "kqVXYqSbfrMhvMZf"
  };

  async function getAccessToken() {

    try {

      const response = await fetch(AUTH_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(authPayload)
      });

      if (!response.ok) {
        throw new Error("Auth API failed");
      }

      const data = await response.json();

      return data.access_token;

    } catch (error) {

      console.error("Auth Error:", error);

      document.getElementById("error").innerText =
        "Failed to get access token";

      return null;
    }
  }

  async function fetchNotifications() {

    try {

      // STEP 1:
      // Get fresh token
      const token = await getAccessToken();

      if (!token) {
        return;
      }

      // STEP 2:
      // Fetch notifications
      const response = await fetch(
        NOTIFICATION_URL,
        {
          method: "GET",

          headers: {
            "Authorization": `Bearer ${token}`
          }
        }
      );

      if (!response.ok) {
        throw new Error(
          "Failed to fetch notifications"
        );
      }

      const data = await response.json();

      let notifications = data.notifications;

      // STEP 3:
      // Sort notifications
      notifications.sort((a, b) => {

        const typeCompare =
          priority[a.Type] -
          priority[b.Type];

        if (typeCompare !== 0) {
          return typeCompare;
        }

        return new Date(b.Timestamp) -
               new Date(a.Timestamp);
      });

      // STEP 4:
      // Top 10
      notifications =
        notifications.slice(0, 10);

      renderNotifications(notifications);

    } catch (error) {

      console.error(error);

      document.getElementById("error").innerText =
        error.message;

    } finally {

      document.getElementById("loading").style.display =
        "none";
    }
  }

  function renderNotifications(notifications) {

    const container =
      document.getElementById(
        "notificationList"
      );

    container.innerHTML = "";

    notifications.forEach(notification => {

      const card =
        document.createElement("div");

      card.classList.add(
        "card",
        notification.Type.toLowerCase()
      );

      card.innerHTML = `
        <div class="top">

          <div class="type">
            ${notification.Type}
          </div>

        </div>

        <div class="message">
          ${notification.Message}
        </div>

        <div class="timestamp">
          ${notification.Timestamp}
        </div>
      `;

      container.appendChild(card);
    });
  }

  // Run on page load
  fetchNotifications();

</script>

</body>
</html>
